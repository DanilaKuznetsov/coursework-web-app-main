{% extends 'store/base.html' %}

{% block content %}
<h2>Каталог товаров</h2>

<form method="get" style="margin-bottom: 20px; display: flex; gap: 10px;">
    <input type="text" name="q" placeholder="Поиск по названию..." value="{{ query }}">
    <select name="category" style="width: auto;">
        <option value="">Все категории</option>
        {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn">Найти</button>
</form>

<div style="display: flex; flex-wrap: wrap; gap: 20px;">
    {% for product in products %}
    <div style="border: 1px solid #eee; padding: 15px; border-radius: 8px; width: calc(33% - 20px); text-align: center; box-sizing: border-box;">
        {% if product.image_url %}
            <img src="{{ product.image_url }}" alt="{{ product.name }}" style="max-width: 100%; height: 150px; object-fit: cover;">
        {% endif %}
        <h3>{{ product.name }}</h3>
        <p>Цена: <b>{{ product.price }} руб.</b></p>
        <a href="{% url 'product_detail' product.id %}" class="btn">Подробнее</a>
        <a href="{% url 'add_to_cart' product.id %}" class="btn" style="background-color: #27ae60; margin-top: 5px;">В корзину</a>
    </div>
    {% empty %}
    <p>Товары не найдены.</p>
    {% endfor %}
</div>
{% endblock %}
